name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip openjdk-17-jdk-headless python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev
      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython
      - name: Build APK
        run: |
          yes | buildozer android debug 2>&1 | tee /tmp/build.log
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brawl-stars-bot-apk
          path: bin/*.apk
          retention-days: 7
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 3
